name: Build Windows

# Builds the Windows app natively on a Windows runner (no Wine/cross-compile,
# which is what made the old cross-platform build flaky). Produces a downloadable
# installer artifact on every push, and attaches it to GitHub Releases.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the installer to a GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check renderer.js
          node --check main.js
          node --check preload.js
          node --check frame-extractor.js

      - name: Download FFmpeg (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Write-Host "Downloading FFmpeg from $url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          $ff = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffmpeg.exe  | Select-Object -First 1
          $fp = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ff -or -not $fp) { throw "ffmpeg.exe/ffprobe.exe not found in the download" }
          Copy-Item $ff.FullName ./ffmpeg.exe  -Force
          Copy-Item $fp.FullName ./ffprobe.exe -Force
          Remove-Item ffmpeg.zip, ffmpeg-tmp -Recurse -Force
          Write-Host "FFmpeg ready:"
          Get-Item ffmpeg.exe, ffprobe.exe | Select-Object Name, Length

      - name: Build Windows installer
        run: npm run build-win
        env:
          # publish is disabled in package.json build config; token kept for safety.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Morph-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
